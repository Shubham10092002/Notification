spring.application.name=Notification

server.port=8085

# Local secrets/overrides. Kept at the project root and gitignored.
# Copy application-local.properties.example -> application-local.properties.
# Optional: if absent, the values below resolve from environment variables instead.
spring.config.import=optional:file:./application-local.properties

## Mysql
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
#drop n create table again, good for testing, comment this in production
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

## Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
# Durability over latency: a lost notification is worse than a slow one.
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
# No type headers on the wire. Payloads are plain JSON, so services in other languages can
# publish to notification.requests without emulating a Java class name.
spring.kafka.producer.properties.spring.json.add.type.headers=false

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# Raw bytes on the consumer; ByteArrayJacksonJsonMessageConverter then deserializes using the
# listener method's parameter type. Type-header-based deserialization would break for any
# external publisher, which is exactly who the inbound topic is for.
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
# Offsets committed by the container after the listener returns, so a crash mid-delivery
# redelivers rather than silently dropping the notification.
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record
# One consumer thread per partition; without this a single thread serves all 3 partitions.
spring.kafka.listener.concurrency=${KAFKA_LISTENER_CONCURRENCY:3}

## Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2s

## Mail (SMTP). Credentials come from the environment, never from this file.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
# JavaMail defaults to waiting forever. Without these a blackholed SMTP server parks a Kafka
# consumer thread permanently, and neither the retry budget nor the circuit breaker can help:
# both are downstream of a call that never returns. Worst case per attempt is now ~25s, well
# inside the 2-minute retry window.
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECT_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_READ_TIMEOUT_MS:10000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT_MS:10000}

## Notification platform
notification.email.from=${NOTIFICATION_EMAIL_FROM:no-reply@example.com}
# 'log' does not send real SMS; it records the attempt. Replace once a provider is chosen.
notification.sms.provider=${SMS_PROVIDER:log}
notification.kafka.partitions=${KAFKA_TOPIC_PARTITIONS:3}
# Defaults suit local development only. Production must set replicas=3 and min-insync=2,
# otherwise acks=all is meaningless and one broker failure loses unconsumed notifications.
notification.kafka.replicas=${KAFKA_TOPIC_REPLICAS:1}
notification.kafka.min-insync-replicas=${KAFKA_MIN_ISR:1}

# Per-channel send budgets, enforced cluster-wide via Redis. Keyed by channel, so adding a
# channel is a config entry rather than a code change. A channel with no entry here falls back
# to default-limit rather than to zero, because a zero budget would silently block it entirely.
notification.rate-limit.channels.EMAIL.permits=600
notification.rate-limit.channels.EMAIL.window=1m
notification.rate-limit.channels.SMS.permits=120
notification.rate-limit.channels.SMS.window=1m
notification.rate-limit.default-limit.permits=120
notification.rate-limit.default-limit.window=1m

# Retry backoff before a message is dead-lettered.
# Kept well under Kafka's max.poll.interval.ms (5 min): these retries block the partition, so a
# long window would turn one bad message into head-of-line blocking for everything behind it.
# Longer provider outages are handled by replaying from the DLT, not by waiting here.
notification.retry.initial-interval-ms=1000
notification.retry.multiplier=2.0
notification.retry.max-interval-ms=30000
notification.retry.max-elapsed-time-ms=120000

notification.cache.template-ttl-minutes=30

# Circuit breaker per channel. Stops a provider outage from consuming consumer threads on calls
# that are certain to fail, and gives the provider room to recover.
notification.circuit-breaker.sliding-window-size=20
notification.circuit-breaker.minimum-calls=10
notification.circuit-breaker.failure-rate-threshold=50
notification.circuit-breaker.open-seconds=30
notification.circuit-breaker.half-open-calls=3

# Recovers notifications committed to the DB whose Kafka publish never landed.
notification.sweeper.stuck-after-seconds=60
notification.sweeper.interval-ms=30000
notification.sweeper.initial-delay-ms=30000

## Service-to-service API credentials. Override in every real environment.
notification.api.username=${NOTIFICATION_API_USER:notification-client}
notification.api.password=${NOTIFICATION_API_PASSWORD:}

## Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true