spring.application.name=Notification

server.port=8085

# Local secrets/overrides. Kept at the project root and gitignored.
# Copy application-local.properties.example -> application-local.properties.
# Optional: if absent, the values below resolve from environment variables instead.
spring.config.import=optional:file:./application-local.properties

## Mysql
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
#drop n create table again, good for testing, comment this in production
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

## Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
# Durability over latency: a lost notification is worse than a slow one.
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
# Manual ack after the DB write, so a crash mid-delivery redelivers rather than silently drops.
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.properties.spring.json.trusted.packages=com.common.Notification.messaging
spring.kafka.listener.ack-mode=record

## Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2s

## Mail (SMTP). Credentials come from the environment, never from this file.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}

## Notification platform
notification.email.from=${NOTIFICATION_EMAIL_FROM:no-reply@example.com}
# 'log' does not send real SMS; it records the attempt. Replace once a provider is chosen.
notification.sms.provider=${SMS_PROVIDER:log}
notification.kafka.partitions=3

# Per-channel send budgets, enforced cluster-wide via Redis.
notification.rate-limit.email-per-minute=600
notification.rate-limit.sms-per-minute=120

# Retry backoff before a message is dead-lettered (15 minutes total by default).
notification.retry.initial-interval-ms=1000
notification.retry.multiplier=2.0
notification.retry.max-interval-ms=60000
notification.retry.max-elapsed-time-ms=900000

notification.cache.template-ttl-minutes=30

## Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true